# Builds the launcher and its Qt tests on Windows and runs them (no game, no game code).
name: Windows launcher tests
on:
  push:
    branches: [windows-port]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.7.3
          arch: win64_msvc2019_64
          cache: true
      - name: zlib
        run: vcpkg install zlib:x64-windows-static-md
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          cmake --build build
      - name: Tests
        run: ctest --test-dir build -V
      - name: Run each test directly (exit codes)
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem build/tests -Filter test_*.exe | ForEach-Object {
            Write-Host "=== $($_.Name)"
            & $_.FullName -o "$($_.BaseName).txt,txt" | Out-Null
            Write-Host ("exit {0:X}" -f $LASTEXITCODE)
            Get-Content "$($_.BaseName).txt" -ErrorAction SilentlyContinue | Select-String -Pattern 'FAIL!|Loc:|Actual|Expected|XFAIL|Totals' -Context 0,0 | Write-Host
          }
