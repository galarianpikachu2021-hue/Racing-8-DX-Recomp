# Builds the Windows engine and exporter from the pinned upstream fork plus our patches, and runs the Windows tests that need no game.
# Runs on pushes to the windows-port branch and by hand. CI never sees game files.
name: Windows engine
on:
  push:
    branches: [windows-port]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engine:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Vulkan SDK (glslangValidator)
        shell: pwsh
        run: |
          choco install vulkan-sdk -y --no-progress
          $sdk = Get-ChildItem C:\VulkanSDK -Directory | Sort-Object Name -Descending | Select-Object -First 1
          "VULKAN_SDK=$($sdk.FullName)" >> $env:GITHUB_ENV
          "$($sdk.FullName)\Bin" >> $env:GITHUB_PATH
      - name: Fetch the fork and apply our patches
        shell: bash
        run: packaging/windows/fetch-fork.sh fork
      - name: Configure
        shell: bash
        env:
          MSYS_NO_PATHCONV: '1'
        run: |
          VERSION="$(cat patches/suyu/*.patch | sha256sum | cut -c1-10)-abi6"
          echo "ENGINE_VERSION=$VERSION" >> "$GITHUB_ENV"
          cmake -S fork -B build -GNinja -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_QT=OFF -DYUZU_TESTS=OFF -DENABLE_WEB_SERVICE=OFF \
            -DSUYU_NO_JIT=ON -DKARTRECOMP_ENGINE=ON -DKARTRECOMP_ENGINE_VERSION="$VERSION"
      - name: Build
        shell: bash
        run: cmake --build build --target mk8d-engine kartrecomp-export -- -k 0
      - name: Stage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage\engine | Out-Null
          Copy-Item build\bin\mk8d-engine.exe, build\bin\kartrecomp-export.exe stage\engine\
          Get-ChildItem build\bin -Filter *.dll | Copy-Item -Destination stage\engine\
          $env:ENGINE_VERSION | Set-Content stage\engine\ENGINE_VERSION
      - name: Module guard test
        shell: pwsh
        run: tests\test_module_guard.ps1 -EngineDir stage\engine
      - uses: actions/upload-artifact@v4
        with:
          name: windows-engine
          path: stage
          if-no-files-found: error

  toolchain:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the toolchain
        shell: pwsh
        run: packaging\windows\make-toolchain.ps1 -Out stage\toolchain
      - name: Toolchain test
        shell: pwsh
        run: tests\windows\test_toolchain.ps1 -Toolchain stage\toolchain
      - uses: actions/upload-artifact@v4
        with:
          name: windows-toolchain
          path: stage\toolchain
          if-no-files-found: error

  launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.7.3
          arch: win64_msvc2019_64
          cache: true
      - name: zlib
        run: vcpkg install zlib:x64-windows-static-md
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          cmake --build build
      - name: Bundle Qt
        run: |
          New-Item -ItemType Directory -Force stage\launcher | Out-Null
          Copy-Item build\app\kartrecomp.exe, build\app\kartrecomp-setup.exe, build\app\kartrecomp-build.exe stage\launcher\
          windeployqt --release --no-translations stage\launcher\kartrecomp.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-launcher
          path: stage\launcher
          if-no-files-found: error

  bundle:
    needs: [engine, toolchain, launcher]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-engine
          path: parts\engine-all
      - uses: actions/download-artifact@v4
        with:
          name: windows-toolchain
          path: parts\toolchain
      - uses: actions/download-artifact@v4
        with:
          name: windows-launcher
          path: parts\launcher
      - name: Assemble
        shell: pwsh
        run: packaging\windows\assemble.ps1 -Engine parts\engine-all\engine -Launcher parts\launcher -Toolchain parts\toolchain -Out KartRecomp
      - name: Release contents test
        shell: pwsh
        run: tests\windows\test_release_contents.ps1 KartRecomp
      - name: Zip
        shell: pwsh
        run: |
          Compress-Archive -Path KartRecomp -DestinationPath KartRecomp-windows-x64-TEST.zip -CompressionLevel Optimal
          (Get-FileHash KartRecomp-windows-x64-TEST.zip -Algorithm SHA256).Hash.ToLower() + "  KartRecomp-windows-x64-TEST.zip" | Out-File -Encoding ascii KartRecomp-windows-x64-TEST.zip.sha256
          "{0:N0} MB" -f ((Get-Item KartRecomp-windows-x64-TEST.zip).Length / 1MB) | Write-Host
      - uses: actions/upload-artifact@v4
        with:
          name: KartRecomp-windows-x64-TEST
          path: |
            KartRecomp-windows-x64-TEST.zip
            KartRecomp-windows-x64-TEST.zip.sha256
          if-no-files-found: error
          compression-level: 0
