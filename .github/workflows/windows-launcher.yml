# Builds the Qt launcher for Windows (no game, no game code) and attaches it to a GitHub release.
name: Windows launcher
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the zip to
        default: v0.1.0
  release:
    types: [published]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.7.3
          arch: win64_msvc2019_64
          cache: true
      - name: zlib
        run: vcpkg install zlib:x64-windows
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake --build build
      - name: Bundle Qt and zlib
        run: |
          New-Item -ItemType Directory -Force dist/KartRecomp-Launcher | Out-Null
          Copy-Item build/app/kartrecomp.exe dist/KartRecomp-Launcher/
          windeployqt --release --no-translations dist/KartRecomp-Launcher/kartrecomp.exe
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/zlib1.dll" dist/KartRecomp-Launcher/
          Copy-Item LEGAL.md dist/KartRecomp-Launcher/ -ErrorAction SilentlyContinue
          Compress-Archive -Path dist/KartRecomp-Launcher -DestinationPath KartRecomp-Launcher-windows-x64.zip
          (Get-FileHash KartRecomp-Launcher-windows-x64.zip -Algorithm SHA256).Hash.ToLower() + "  KartRecomp-Launcher-windows-x64.zip" | Out-File -Encoding ascii KartRecomp-Launcher-windows-x64.zip.sha256
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:TAG" KartRecomp-Launcher-windows-x64.zip KartRecomp-Launcher-windows-x64.zip.sha256 --clobber
