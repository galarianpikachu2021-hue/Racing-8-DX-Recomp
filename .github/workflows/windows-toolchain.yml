# Assembles the Windows module toolchain (llvm-mingw) and tests that it builds and loads a module-style DLL. No game files.
name: Windows toolchain
on:
  push:
    branches: [windows-port]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  toolchain:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the toolchain
        shell: pwsh
        run: packaging\windows\make-toolchain.ps1 -Out stage\toolchain
      - name: Toolchain test
        shell: pwsh
        run: tests\windows\test_toolchain.ps1 -Toolchain stage\toolchain
      - uses: actions/upload-artifact@v4
        with:
          name: windows-toolchain
          path: stage
          if-no-files-found: error
